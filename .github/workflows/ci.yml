name: Repository checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt -r requirements-notebook.txt
      - run: npm ci
      - run: python scripts/audit_public_repo.py
      - run: python scripts/check_docs.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/*.test.cjs tests/*.test.mjs
      - run: npm run build:place
