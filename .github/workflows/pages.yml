name: Deploy GitHub Pages

on:
  # Publication is deliberate; the owner has confirmed the data permission.
  # Review docs/publication-audit.md before manually deploying.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out prepared site
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
